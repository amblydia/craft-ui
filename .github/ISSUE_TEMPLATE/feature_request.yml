name: Component or feature request
description: Suggest a new component or an improvement.
labels: [ enhancement ]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to build?
      description: The interface you're making, and what's missing for it.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: How should it look?
      description: Describe the Ore UI screen or control you have in mind. Please don't attach game assets.
