name: Deploy

# Builds and pushes the image to GHCR, then asks Coolify to redeploy
# craftui.runqora.dev. Expects the COOLIFY_WEBHOOK and COOLIFY_TOKEN secrets.
#
# Run by hand for now. Once the Coolify application exists (see
# docs/deployment.md), add a `push` trigger on main to deploy on every merge.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    uses: Amblydia/github-actions/.github/workflows/docker-deploy.yml@main
    with:
      dockerfile: ./docker/Dockerfile
      test-target: checks
    secrets:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
