name: Docker

# Lint, formatting and types in the Dockerfile's `checks` stage, then the image
# built the way a deployment builds it. Nothing is pushed. Runs on pull requests
# only: on main, the Publish image workflow builds and pushes the same image.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    uses: Amblydia/github-actions/.github/workflows/docker-pr.yml@main
    with:
      dockerfile: ./docker/Dockerfile
      test-target: checks
