name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Every Monday, so a change in the shadcn CLI shows up even in a quiet week.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web registry:build
      - run: bun run check

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test

  site:
    name: Docs site and registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the site and registry
        run: bun run --cwd apps/web build
      - name: Validate the registry
        run: bun run registry:validate
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run browser and accessibility tests
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  # Installs every item into a brand new project, as a developer would, with
  # the latest shadcn CLI, then uses the components in a real browser.
  install:
    name: Install (${{ matrix.template }}, ${{ matrix.style }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [ next, vite ]
        style: [ base-nova, radix-nova ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
        working-directory: packages/tooling
      - name: Install and verify
        run: >-
          bun run test:install --template ${{ matrix.template }}
          --style ${{ matrix.style }} --browser
