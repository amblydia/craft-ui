name: Publish image

# Builds the image and pushes it to GHCR on every push to main, and can also be
# run by hand. It doesn't deploy: Runqora projects don't deploy automatically,
# so start deployments in Coolify, which pulls the newest `latest`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: Amblydia/github-actions/.github/workflows/docker-build.yml@main
    with:
      dockerfile: ./docker/Dockerfile
      push: true
      test-target: checks
